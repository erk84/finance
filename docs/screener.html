window.__cryptoDebug = { enabled: false }; // sätt true via query (?debug=1) eller manuellt

function dbg(...a){ if (window.__cryptoDebug.enabled) { try { console.log('[crypto]', ...a); } catch {} } }

function showDiagError(msg) {
  const el = document.getElementById('error-msg');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = msg;
}

function b64urlToBytes(maybeUrlB64) {
  let s = (maybeUrlB64 || '').replace(/[\r\n\s]/g,'').replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decryptContent(encryptedDataRaw, passwordRaw) {
  try {
    if (!window.crypto || !window.crypto.subtle) {
      showDiagError('Kunde inte initiera kryptomotor (kräver https eller localhost på iOS).');
      return null;
    }

    // Sanera lösenord (utan att ta bort legitima spaces)
    function cleanPwd(s) {
      const ZERO_WIDTH=/[\u200B-\u200D\uFEFF]/g, SMART=/[\u2018\u2019\u201C\u201D]/g;
      return (s??'').replace(ZERO_WIDTH,'').replace(SMART, m=>({'‘':"'",'’':"'",'“':'"','”':'"'}[m])).normalize('NFKC');
    }
    const password = cleanPwd(passwordRaw);

    // Versionerat prefix?
    const PREFIX = 'enc:v1:gcm:';
    if (encryptedDataRaw.startsWith(PREFIX)) {
      const payload = b64urlToBytes(encryptedDataRaw.slice(PREFIX.length));
      const out = await tryGcm(payload, password);
      return out;
    }

    // Ingen prefix: prova GCM heuristiskt (salt(16)+iv(12)+min tag(16))
    try {
      const maybeGcm = b64urlToBytes(encryptedDataRaw);
      if (maybeGcm.length >= 16+12+16) {
        const out = await tryGcm(maybeGcm, password);
        if (out != null) return out;
      }
    } catch (e) { dbg('GCM-heuristik misslyckades', e); }

    // Fallback: legacy CBC (iv(16)|ct) + repad nyckel
    try {
      const legacy = atob(encryptedDataRaw.replace(/[\r\n\s]/g,''));
      const bytes = new Uint8Array(legacy.length); for (let i=0;i<legacy.length;i++) bytes[i]=legacy.charCodeAt(i);
      if (bytes.length >= 16+1) {
        const out = await tryLegacyCbc(bytes, password);
        return out;
      }
    } catch (e) { dbg('Legacy CBC misslyckades', e); }

    showDiagError('Dekryptering misslyckades. Kontrollera att format/algoritm matchar.');
    return null;
  } catch (e) {
    dbg('Decrypt fatal', e);
    showDiagError('Tekniskt fel vid dekryptering: ' + (e?.message||e));
    return null;
  }
}

async function tryGcm(payload, password) {
  try {
    const SALT_LEN=16, IV_LEN=12, TAG_LEN_BITS=128;
    if (payload.length < SALT_LEN+IV_LEN+16) throw new Error('payload för kort');

    const salt = payload.slice(0, SALT_LEN);
    const iv   = payload.slice(SALT_LEN, SALT_LEN+IV_LEN);
    const ctTag= payload.slice(SALT_LEN+IV_LEN);

    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name:'PBKDF2' }, false, ['deriveKey']);
    const aesKey  = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:200000, hash:{name:'SHA-256'} },
      baseKey,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );

    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv, tagLength:TAG_LEN_BITS }, aesKey, ctTag);
    const text = new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(plainBuf));

    // Sanity check: ser det ut som HTML?
    if (!/</.test(text)) dbg('GCM dekrypterade men ser inte ut som HTML');
    return text;
  } catch (e) {
    dbg('GCM decrypt fail', e);
    return null;
  }
}

async function tryLegacyCbc(bytes, password) {
  try {
    const iv = bytes.slice(0,16);
    const ct = bytes.slice(16);

    // Repa lösenordet till 32 byte (samma som din gamla C#-logik)
    const pw = new TextEncoder().encode(password);
    const keyBytes = new Uint8Array(32);
    for (let i=0;i<32;i++) keyBytes[i]=pw[i%pw.length];

    const key = await crypto.subtle.importKey('raw', keyBytes, { name:'AES-CBC' }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-CBC', iv }, key, ct);

    const text = new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(plain));
    return text;
  } catch (e) {
    dbg('CBC decrypt fail', e);
    return null;
  }
}
