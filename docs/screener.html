<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=0.8'>
    <title>ACCESS RESTRICTED - AUTHORIZATION REQUIRED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Source Code Pro', monospace;
            background: #000;
            color: #00ff00;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        /* Matrix-like background effect */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(90deg, transparent 98%, #00ff0020 100%),
                        linear-gradient(transparent 98%, #00ff0010 100%);
            background-size: 20px 20px;
            animation: matrix-scroll 20s linear infinite;
        }
        
        @keyframes matrix-scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(20px); }
        }
        
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .access-panel {
            background: #111;
            border: 2px solid #00ff00;
            border-radius: 0;
            padding: 40px;
            min-width: 450px;
            box-shadow: 0 0 50px #00ff0030, inset 0 0 50px rgba(0, 255, 0, 0.05);
            animation: panel-glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes panel-glow {
            from { box-shadow: 0 0 50px #00ff0030, inset 0 0 50px rgba(0, 255, 0, 0.05); }
            to { box-shadow: 0 0 80px #00ff0050, inset 0 0 50px rgba(0, 255, 0, 0.1); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: flicker 2s infinite;
        }
        
        @keyframes flicker {
            0%, 98% { opacity: 1; }
            99% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #ff0040;
            text-shadow: 0 0 10px #ff0040;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            opacity: 0.8;
            animation: typing 3s steps(30) 1s 1 normal both;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #00ff00;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Source Code Pro', monospace;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            border-color: #ff0040;
            box-shadow: 0 0 20px #00ff0030;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .access-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #001100, #003300);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Source Code Pro', monospace;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .access-btn:hover {
            background: linear-gradient(45deg, #002200, #004400);
            box-shadow: 0 0 30px #00ff0050;
            transform: translateY(-2px);
        }
        
        .access-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #ff0040;
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
            text-shadow: 0 0 5px #ff0040;
            display: none;
            animation: error-pulse 0.5s ease-in-out;
        }
        
        @keyframes error-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #00ff00;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 10px;
            color: #666;
            opacity: 0.7;
        }
        
        /* Hidden content area */
        .decrypted-content {
            display: none;
        }
        
        /* Terminal-style cursor */
        .cursor {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>

window.__cryptoDebug = { enabled: false }; // sätt true via query (?debug=1) eller manuellt

(function() {
  const params = new URLSearchParams(location.search);
  if (params.get('debug') === '1') window.__cryptoDebug.enabled = true;
})();

function dbg(...a){ if (window.__cryptoDebug.enabled) { try { console.log('[crypto]', ...a); } catch {} } }

function showDiagError(msg) {
  const el = document.getElementById('error-msg');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = msg;
}

function b64urlToBytes(maybeUrlB64) {
  let s = (maybeUrlB64 || '').replace(/[\r\n\s]/g,'').replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decryptContent(encryptedDataRaw, passwordRaw) {
  try {
    if (!window.crypto || !window.crypto.subtle) {
      showDiagError('Kunde inte initiera kryptomotor (kräver https eller localhost på iOS).');
      return null;
    }

    // Sanera lösenord (utan att ta bort legitima spaces)
    function cleanPwd(s) {
      const ZERO_WIDTH=/[\u200B-\u200D\uFEFF]/g, SMART=/[\u2018\u2019\u201C\u201D]/g;
      return (s??'').replace(ZERO_WIDTH,'').replace(SMART, m=>({'‘':"'",'’':"'",'“':'"','”':'"'}[m])).normalize('NFKC');
    }
    const password = cleanPwd(passwordRaw);

    // Versionerat prefix?
    const PREFIX = 'enc:v1:gcm:';
    if (encryptedDataRaw.startsWith(PREFIX)) {
      const payload = b64urlToBytes(encryptedDataRaw.slice(PREFIX.length));
      const out = await tryGcm(payload, password);
      return out;
    }

    // Ingen prefix: prova GCM heuristiskt (salt(16)+iv(12)+min tag(16))
    try {
      const maybeGcm = b64urlToBytes(encryptedDataRaw);
      if (maybeGcm.length >= 16+12+16) {
        const out = await tryGcm(maybeGcm, password);
        if (out != null) return out;
      }
    } catch (e) { dbg('GCM-heuristik misslyckades', e); }

    // Fallback: legacy CBC (iv(16)|ct) + repad nyckel
    try {
      const legacy = atob(encryptedDataRaw.replace(/[\r\n\s]/g,''));
      const bytes = new Uint8Array(legacy.length); for (let i=0;i<legacy.length;i++) bytes[i]=legacy.charCodeAt(i);
      if (bytes.length >= 16+1) {
        const out = await tryLegacyCbc(bytes, password);
        return out;
      }
    } catch (e) { dbg('Legacy CBC misslyckades', e); }

    showDiagError('Dekryptering misslyckades. Kontrollera att format/algoritm matchar.');
    return null;
  } catch (e) {
    dbg('Decrypt fatal', e);
    showDiagError('Tekniskt fel vid dekryptering: ' + (e?.message||e));
    return null;
  }
}

async function tryGcm(payload, password) {
  try {
    const SALT_LEN=16, IV_LEN=12, TAG_LEN_BITS=128;
    if (payload.length < SALT_LEN+IV_LEN+16) throw new Error('payload för kort');

    const salt = payload.slice(0, SALT_LEN);
    const iv   = payload.slice(SALT_LEN, SALT_LEN+IV_LEN);
    const ctTag= payload.slice(SALT_LEN+IV_LEN);

    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name:'PBKDF2' }, false, ['deriveKey']);
    const aesKey  = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:200000, hash:{name:'SHA-256'} },
      baseKey,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );

    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv, tagLength:TAG_LEN_BITS }, aesKey, ctTag);
    const text = new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(plainBuf));

    // Sanity check: ser det ut som HTML?
    if (!/</.test(text)) dbg('GCM dekrypterade men ser inte ut som HTML');
    return text;
  } catch (e) {
    dbg('GCM decrypt fail', e);
    return null;
  }
}

async function tryLegacyCbc(bytes, password) {
  try {
    const iv = bytes.slice(0,16);
    const ct = bytes.slice(16);

    // Repa lösenordet till 32 byte (samma som din gamla C#-logik)
    const pw = new TextEncoder().encode(password);
    const keyBytes = new Uint8Array(32);
    for (let i=0;i<32;i++) keyBytes[i]=pw[i%pw.length];

    const key = await crypto.subtle.importKey('raw', keyBytes, { name:'AES-CBC' }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-CBC', iv }, key, ct);

    const text = new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(plain));
    return text;
  } catch (e) {
    dbg('CBC decrypt fail', e);
    return null;
  }
}

                passwordInput.focus();
                document.getElementById('btn-text').textContent = 'INITIALIZE ACCESS';
                
                // Shake animation
                const panel = document.querySelector('.access-panel');
                panel.style.animation = 'none';
                setTimeout(() => {
                    panel.style.animation = 'panel-glow 3s ease-in-out infinite alternate';
                }, 100);
            }
            
            // Allow Enter key
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });
        }
    </script>
</body>
</html>
